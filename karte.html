<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urbex Scope – Karte</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Leaflet Control Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Marker Cluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet Control Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Unbounded', sans-serif;
      background: #000;
      color: #eee;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .custom-popup {
      border: 2px solid orange;
      border-radius: 8px;
      padding: 5px;
      background: rgba(0,0,0,0.8);
      color: white;
    }

    /* Geocoder Suchleiste sichtbar, breiter und optisch angepasst */
    .leaflet-control-geocoder {
      max-width: 400px;
      z-index: 1000;
    }

    .leaflet-control-geocoder-form input {
      height: 35px;
      font-size: 1rem;
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid orange;
      background: #255;
      color: #255;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Karte initialisieren
    const map = L.map('map').setView([51.1657, 10.4515], 6);

    // OpenStreetMap Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marker Cluster erstellen
    const markerCluster = L.markerClusterGroup();

    // Layer für die Marker
    const markersLayer = new L.LayerGroup();

    // Orte aus JSON laden
    fetch('orte.json')
      .then(response => {
        if (!response.ok) throw new Error('Fehler beim Laden von orte.json');
        return response.json();
      })
      .then(data => {
        data.forEach(ort => {
          const marker = L.marker([ort.lat, ort.lng], { title: ort.name });

          marker.bindPopup(`
            <div class="custom-popup">
              <b>${ort.name}</b><br>
              ${ort.beschreibung}<br>
              <a href="https://www.google.com/maps/search/?api=1&query=${ort.lat},${ort.lng}" target="_blank" style="color:orange; text-decoration:underline;">
                Zur Navigation
              </a>
            </div>
          `);

          markerCluster.addLayer(marker);
          markersLayer.addLayer(marker);
        });

        map.addLayer(markerCluster);
      })
      .catch(err => {
        console.error(err);
        alert('Die Ortsdaten konnten nicht geladen werden. Prüfe bitte orte.json und den Server.');
      });

    // Geocoder-Suche für Städte/Bundesländer weltweit
    const geocoder = L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: 'Stadt oder Bundesland suchen…'
    }).addTo(map);

    // Textbox sofort sichtbar machen
    const form = document.querySelector('.leaflet-control-geocoder-form');
    if(form) form.style.display = 'block';

    // Aktion beim Finden eines Ortes
    geocoder.on('markgeocode', function(e) {
        const bbox = e.geocode.bbox;
        if (bbox) {
            map.fitBounds(bbox);
        } else if (e.geocode.center) {
            map.setView(e.geocode.center, 10);
        }
    });
  </script>

</body>
</html>
