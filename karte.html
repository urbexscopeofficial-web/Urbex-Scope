<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urbex Scope – Karte</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Leaflet Search CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-search/dist/leaflet-search.min.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Marker Cluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet Search JS -->
  <script src="https://unpkg.com/leaflet-control-search/dist/leaflet-search.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Unbounded', sans-serif;
      background: #000;
      color: #eee;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .custom-popup {
      border: 2px solid orange;
      border-radius: 8px;
      padding: 5px;
      background: rgba(0,0,0,0.8);
      color: white;
    }

    .leaflet-control-search {
      max-width: 200px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // Karte initialisieren
    const map = L.map('map').setView([51.1657, 10.4515], 6);

    // OpenStreetMap Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marker Cluster erstellen
    const markerCluster = L.markerClusterGroup();

    // Layer für die Suche
    const markersLayer = new L.LayerGroup();

    // Orte aus JSON laden
    fetch('orte.json')
      .then(response => {
        if (!response.ok) throw new Error('Fehler beim Laden von orte.json');
        return response.json();
      })
      .then(data => {
        data.forEach(ort => {
          // Marker erstellen
          const marker = L.marker([ort.lat, ort.lng], { title: ort.name });

          // Popup mit Name, Beschreibung und Google Maps Link
          marker.bindPopup(`
            <div class="custom-popup">
              <b>${ort.name}</b><br>
              ${ort.beschreibung}<br>
              <a href="https://www.google.com/maps/search/?api=1&query=${ort.lat},${ort.lng}" target="_blank" style="color:orange; text-decoration:underline;">
                Zur Navigation
              </a>
            </div>
          `);

          // Marker zum Cluster und zum Such-Layer hinzufügen
          markerCluster.addLayer(marker);
          markersLayer.addLayer(marker);
        });

        // Cluster zur Karte hinzufügen
        map.addLayer(markerCluster);

        // Suchleiste hinzufügen
        const searchControl = new L.Control.Search({
          layer: markersLayer,
          propertyName: 'title',
          marker: false,
          moveToLocation: function(latlng, title, map) {
            map.setView(latlng, 15);
          }
        });

        searchControl.on('search:locationfound', function(e) {
          e.layer.openPopup();
        });

        map.addControl(searchControl);
      })
      .catch(err => {
        console.error(err);
        alert('Die Ortsdaten konnten nicht geladen werden. Prüfe bitte orte.json und den Server.');
      });
  </script>

</body>
</html>
