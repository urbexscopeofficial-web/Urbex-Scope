<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Urbex Scope – Karte</title>

  <!-- Favicon / App Icons -->
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Urbex Scope" />

  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

  <!-- Leaflet Control Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Marker Cluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet Control Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Unbounded', sans-serif;
      background: #000;
      color: #eee;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .custom-popup {
      border: 2px solid orange;
      border-radius: 8px;
      padding: 5px;
      background: rgba(0,0,0,0.8);
      color: white;
    }

    /* =========================
       SUCHFELD – DARK URBEX STYLE
       ========================= */

    .leaflet-control-geocoder {
      max-width: 420px;
      z-index: 1000;
    }

    .leaflet-control-geocoder-form input {
      height: 42px;
      font-size: 1rem;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid orange;
      background: #111;
      color: #fff;
      outline: none;
      box-shadow: 0 0 10px rgba(255,165,0,0.4);
      transition: 0.2s ease;
    }

    .leaflet-control-geocoder-form input:focus {
      box-shadow: 0 0 15px rgba(255,165,0,0.8);
      border-color: #ff8800;
    }

    /* =========================
       LADE-SCREEN
       ========================= */

    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader img {
      width: 120px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

  </style>
</head>
<body>

  <!-- Lade-Screen -->
  <div id="loader">
    <img src="logo.jpg" alt="Urbex Scope Logo">
  </div>

  <div id="map"></div>

  <script>
    // Karte initialisieren
    const map = L.map('map').setView([51.1657, 10.4515], 6);

    // OpenStreetMap Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marker Cluster mit chunkedLoading
    const markerCluster = L.markerClusterGroup({
      chunkedLoading: true,
      chunkInterval: 200,
      chunkDelay: 50
    });

    // Orte laden
    fetch('orte.json')
      .then(response => {
        if (!response.ok) throw new Error('Fehler beim Laden von orte.json');
        return response.json();
      })
      .then(data => {
        data.forEach(ort => {
          const marker = L.marker([ort.lat, ort.lng], { title: ort.name });

          marker.bindPopup(`
            <div class="custom-popup">
              <b>${ort.name}</b><br>
              ${ort.beschreibung}<br>
              <a href="https://www.google.com/maps/search/?api=1&query=${ort.lat},${ort.lng}" target="_blank" style="color:orange; text-decoration:underline;">
                Zur Navigation
              </a>
            </div>
          `);

          markerCluster.addLayer(marker);
        });

        map.addLayer(markerCluster);

        // Loader ausblenden
        document.getElementById('loader').classList.add('hidden');
      })
      .catch(err => {
        console.error(err);
        alert('Die Ortsdaten konnten nicht geladen werden. Prüfe bitte orte.json und den Server.');
      });

    // Geocoder
    const geocoder = L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: 'Stadt oder Bundesland suchen…'
    }).addTo(map);

    const form = document.querySelector('.leaflet-control-geocoder-form');
    if(form) form.style.display = 'block';

    geocoder.on('markgeocode', function(e) {
        const bbox = e.geocode.bbox;
        if (bbox) {
            map.fitBounds(bbox);
        } else if (e.geocode.center) {
            map.setView(e.geocode.center, 10);
        }
    });
  </script>

</body>
</html>
